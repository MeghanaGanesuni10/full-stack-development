<!DOCTYPE html>
<html>
    <head>
        <title>CSS Box Model</title>
        <style>
            .box{
                width: 300px;
                height: 150px;
                padding: 20px;
                border: 5px solid black;
                margin: 30px;
            }
        </style>
    </head>
    <body>
        <div class = "box">
            This is content area
            <br>
            padding is inside the border
            <br>
            Border surrounds the padding
            <br>
            Margin is outside the border
        </div>
    </body>
</html>
