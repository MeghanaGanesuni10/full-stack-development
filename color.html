<!DOCTYPE html>
<html>
    <head>
        <title>CSS color References</title>
        <style>
            .named{
                color : red;
            }
            .hex{
                color : #00FF00;
            }
            .rgb{
                color: rgb(0,0,254);
            }
            .rgba{
                color:rgba(255,0,0,0.2);
            }
            .hsl{
                color : hsl(110,100%,25%);
            }
        </style>
    </head>
    
    <body>
        <h2 class = "named">This text uses Named color</h2>
        <h2 class = "hex">This text uses text color</h2>
        <h2 class = "rgb">This text uses RGB color</h2>
        <h2 class = "rgba">This text uses RGBA color</h2>
        <h2 class = "hsl">This text uses HSL color</h2>
    </body>
</html>
